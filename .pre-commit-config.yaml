repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.6
          - pydantic-settings>=2.2
          - types-requests
        args: [--config-file=pyproject.toml]
        files: ^src/calendar_photo_organizer/

  - repo: local
    hooks:
      - id: no-print-outside-cli
        name: Forbid print() outside cli.py
        language: pygrep
        entry: '\bprint\s*\('
        files: ^src/calendar_photo_organizer/.*\.py$
        exclude: ^src/calendar_photo_organizer/cli\.py$
